# Phase 3: export best.pt (YOLO11s) to the edge formats.
# Run (from the repository root):
#   python -m ppe.export --config configs/export/p3_export_yolo11s.yaml
# Targets this machine cannot build (TensorRT without an NVIDIA GPU, OpenVINO on ARM)
# are skipped with the reason. Exports are not committed (weights/export/ is ignored);
# this command regenerates them, and weights/export/yolo11s/manifest.json records their sha256.

run_name: p3_export_yolo11s
phase: 3
model: yolo11s
weights: weights/best.pt
stem: yolo11s
ultralytics_version: "8.3.21"
out_dir: weights/export/yolo11s
imgsz: 640                       # fixed input, batch 1: what an edge camera loop runs
device: cpu
seed: 0

# INT8 calibration images: a seeded random sample of the TRAIN split. Never test (golden set).
calibration:
  data: configs/data/construction_ppe.yaml
  dataset: construction-ppe
  split: train
  n_images: 300                  # Ultralytics recommends >= 300
  n_images_tflite: 30            # first 30 of the same draw: onnx2tf INT8 at 640 px was killed for memory with 300 and 100 images (12.8 GB at 100) on the 15 GB VM
  seed: 0

targets:
  - onnx_fp32
  - onnx_int8
  - openvino_fp32
  - openvino_fp16
  - openvino_int8
  - ncnn_fp32
  - ncnn_fp16
  - tflite_fp32
  - tflite_fp16
  - tflite_int8                  # Ultralytics "int8" = dynamic range (int8 weights, float activations)
  - tflite_int8static            # full integer quantisation, calibrated
  - engine_fp16                  # Jetson only
  - engine_int8                  # Jetson only
