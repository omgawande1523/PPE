# Phase 5 scenario "real site shift", retrained on a GPU with the WHOLE original training set as replay.
# Run on Colab (T4): notebooks/colab_phase5_retrain.ipynb, which runs
#   python -m ppe.loop --config configs/loop/p5_site_shift_colab.yaml
#
# Why this run exists: in p5_site_shift (CPU, backbone frozen, 200 replay images, 10 epochs) the candidate
# tripled dark-site recall but forgot on clean images, and the gate rejected it (results/phase5_loop.md).
# The user chose this fix on 2026-10-12. Only the improve recipe changes; the stream, site, monitor,
# diagnosis, mining, teacher and gate are identical to p5_site_shift.yaml:
#   replay = all 1,132 clean training images with their original labels (was 200 unshifted ones)
#   nothing frozen (was layers 0-9), 20 epochs (was 10), batch 16, on GPU 0
# The recipe was fixed before any training ran and was NOT chosen by looking at golden-set results.
# This is the third candidate the golden gate sees in Phase 5 (after p5_site_shift and p5_poisoned).
#
# Everything below was fixed before the run; nothing was changed after seeing a result.

run_name: p5_site_shift_colab
scenario: site_shift_full_replay
phase: 5
model: yolo11s
weights: weights/best.pt
ultralytics_version: "8.3.21"
device: 0                     # GPU 0 (Colab T4); on a CPU-only machine pass --device cpu (about 15 h for the fine-tune)
device_label: colab_t4        # written to results.csv (--device overrides both)
imgsz: 640
batch: 16
seed: 0
nms_iou: 0.7
match_iou: 0.5
operating_conf: 0.28          # Phase 1, chosen on val; never re-chosen
cand_conf: 0.10               # candidate boxes for the confidence-drift monitor (Phase 4)

data: configs/data/construction_ppe.yaml
shift_config: configs/shift/p2_shift_yolo11s.yaml    # corruption code and parameters are Phase 2's
golden_manifest: golden/golden_v1.csv

window_size: 40
stream:
  segments:
    - {kind: clean, windows: 5}
    - {kind: condition, condition: low_light, severity: 3, windows: 20}
site: {condition: low_light, severity: 3}           # the gate's new-site sample = val under this condition

faults: {black_gain: 0.02, black_noise: 2.0, covered_sigma: 40, covered_gain: 0.35, defocus_sigma: 6}

monitor:
  reference_images: 300       # seeded train images: confidence reference and healthy-frame sharpness
  fit_windows_per_cell: 20
  ridge_alpha: 1.0
  fit_exclude_conditions: [low_light, rain]   # the scenario conditions are unseen by the monitor's fit
  threshold_windows: 200      # clean val windows for the alarm threshold
  threshold_quantile: 0.99
  min_threshold: 0.05         # Phase 4's fixed threshold, as a floor

diagnose:
  black_mean: 0.012           # mean intensity (0-1) below this = black frame
  covered_std: 0.01           # intensity std below this = flat image (lens covered)
  frozen_diff: 0.002          # mean abs difference from the previous frame below this = stuck
  blur_ratio: 0.5             # sharpness below 0.5 x healthy 1st percentile = degradation (sudden blur)
  fault_frac: 0.5             # share of faulty frames that makes a window a camera fault
  persist_windows: 3          # consecutive alarmed windows = persistent shift
  max_retrains: 1             # runaway guard: at most one retrain per run (the fixed period)
  cooldown_windows: 10

improve:
  min_pool: 400               # frames buffered after the persistent shift before mining
  n_mine: 200
  min_mined: 100              # runaway guard: no retrain on fewer mined frames
  augment: {scale: 0.75, brightness: 1.3}
  teacher: {kind: source_labels}
  human_sample: 20
  n_replay: 1132              # every training image (forgetting guard)
  replay_pool: all_train      # replay from the whole training set, clean, original labels
  finetune:
    epochs: 20
    batch: 16
    imgsz: 640
    optimizer: SGD
    lr0: 0.002
    lrf: 0.5
    warmup_epochs: 0
    freeze: 0                 # nothing frozen
    mosaic: 1.0
    close_mosaic: 5
    workers: 2

verify:
  map50_tolerance: 0.02       # golden mAP@0.5 may fall by at most this; set before the run
  keep_last: 3
