# SH17 (Ahmad and Rahimi 2024, CC BY-NC-SA 4.0), converted to the Construction-PPE class indices.
# Get it: download the Kaggle dataset mugheesahmad/sh17-dataset-for-ppe-detection, unzip it anywhere, then
#   python -m ppe.shift --convert sh17 --src path/to/unzipped/sh17
# By default only SH17's own validation list (val_files.txt, 1620 images) is converted, so its
# training images stay free for later adaptation experiments without touching the evaluation images.
# Mapped: person->Person, helmet->helmet, safety-vest->vest, gloves->gloves, shoes->boots.
# Glasses are excluded (brief). SH17 has no no_* classes.
path: datasets/sh17
test: images/test

names:
  0: helmet
  1: gloves
  2: vest
  3: boots
  4: goggles
  5: none
  6: Person
  7: no_helmet
  8: no_goggle
  9: no_gloves
  10: no_boots
